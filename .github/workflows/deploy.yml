name: VaultForge Deploy - Infrastructure & ECS Fargate Deployment

on:
  workflow_call:
    inputs:
      image_digest:
        type: string
        required: false
      overlay:
        type: string
        default: dev
      aws_region:
        type: string
        default: ap-south-1
    secrets:
      AWS_ROLE_TO_ASSUME:
        required: false
    outputs:
      rollout_result:
        description: "Outcome of the rollout step"
        value: ${{ jobs.deploy.outputs.rollout_result }}
      already_deployed:
        description: "True if target digest was already running in ECS"
        value: ${{ jobs.deploy.outputs.already_deployed }}
      alb_dns_name:
        description: "Discovered ALB DNS Name"
        value: ${{ jobs.deploy.outputs.alb_dns_name }}

concurrency:
  group: vaultforge-deploy-${{ inputs.overlay }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  # ---------------------------------------------------------------
  # ECS Fargate Deployment & Rollout Checkpoint (Multi-Tag Environment Discovery)
  # ---------------------------------------------------------------
  deploy:
    name: Deploy to ECS Fargate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write   # required for OIDC
      security-events: write
    outputs:
      rollout_result: ${{ steps.rollout.outcome || 'skipped' }}
      already_deployed: ${{ steps.ecs-checkpoint.outputs.already_deployed }}
      alb_dns_name: ${{ steps.discover-infra.outputs.alb_dns }}
    steps:
      - uses: actions/checkout@v4

      - name: Check AWS credentials & image digest
        id: check-preconditions
        env:
          AWS_ROLE: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          DIGEST: ${{ inputs.image_digest }}
        run: |
          if [ -z "$AWS_ROLE" ] || [ -z "$DIGEST" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail if AWS role or digest not configured
        if: steps.check-preconditions.outputs.configured != 'true'
        run: |
          echo "::error::AWS_ROLE_TO_ASSUME or image_digest is not set — failing explicitly."
          exit 1

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ inputs.aws_region }}
          audience: sts.amazonaws.com

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Multi-Tag Environment-Aware Infrastructure Discovery
        id: discover-infra
        run: |
          TARGET_ENV="${{ inputs.overlay || 'dev' }}"
          echo "Executing Multi-Tag Discovery for Project=VaultForge and Environment=$TARGET_ENV..."

          # 1. Discover ECS Cluster tagged with BOTH Project=VaultForge and Environment=$TARGET_ENV
          CLUSTER_MATCHES=$(aws resourcegroupstaggingapi get-resources \
            --tag-filters Key=Project,Values=VaultForge Key=Environment,Values="$TARGET_ENV" \
            --resource-type-filters ecs:cluster \
            --query 'ResourceTagMappingList[*].ResourceARN' --output text 2>/dev/null || echo "")

          CLUSTER_COUNT=$(echo "$CLUSTER_MATCHES" | tr -s '[:space:]' '\n' | sed '/^$/d' | wc -l)

          if [ "$CLUSTER_COUNT" -eq 0 ]; then
            echo "::error::No ECS cluster found matching Project=VaultForge and Environment=$TARGET_ENV"
            exit 1
          elif [ "$CLUSTER_COUNT" -gt 1 ]; then
            echo "::error::Ambiguous infrastructure! Found $CLUSTER_COUNT ECS clusters matching Project=VaultForge and Environment=$TARGET_ENV: $CLUSTER_MATCHES"
            exit 1
          fi

          CLUSTER_ARN=$(echo "$CLUSTER_MATCHES" | tr -s '[:space:]' '\n' | head -n 1)
          CLUSTER_NAME=$(echo "$CLUSTER_ARN" | awk -F'/' '{print $2}')

          # 2. Discover ALB DNS Name tagged with BOTH Project=VaultForge and Environment=$TARGET_ENV
          ALB_MATCHES=$(aws resourcegroupstaggingapi get-resources \
            --tag-filters Key=Project,Values=VaultForge Key=Environment,Values="$TARGET_ENV" \
            --resource-type-filters elasticloadbalancing:loadbalancer \
            --query 'ResourceTagMappingList[*].ResourceARN' --output text 2>/dev/null || echo "")

          ALB_COUNT=$(echo "$ALB_MATCHES" | tr -s '[:space:]' '\n' | sed '/^$/d' | wc -l)

          if [ "$ALB_COUNT" -eq 0 ]; then
            echo "::error::No ALB found matching Project=VaultForge and Environment=$TARGET_ENV"
            exit 1
          elif [ "$ALB_COUNT" -gt 1 ]; then
            echo "::error::Ambiguous infrastructure! Found $ALB_COUNT ALBs matching Project=VaultForge and Environment=$TARGET_ENV: $ALB_MATCHES"
            exit 1
          fi

          ALB_ARN=$(echo "$ALB_MATCHES" | tr -s '[:space:]' '\n' | head -n 1)
          ALB_DNS=$(aws elbv2 describe-load-balancers --load-balancer-arns "$ALB_ARN" --query 'LoadBalancers[0].DNSName' --output text 2>/dev/null || echo "")

          # 3. Discover ECS Service Name tagged with BOTH Project=VaultForge and Environment=$TARGET_ENV
          SERVICE_MATCHES=$(aws resourcegroupstaggingapi get-resources \
            --tag-filters Key=Project,Values=VaultForge Key=Environment,Values="$TARGET_ENV" \
            --resource-type-filters ecs:service \
            --query 'ResourceTagMappingList[*].ResourceARN' --output text 2>/dev/null || echo "")

          SERVICE_COUNT=$(echo "$SERVICE_MATCHES" | tr -s '[:space:]' '\n' | sed '/^$/d' | wc -l)

          if [ "$SERVICE_COUNT" -eq 1 ]; then
            SERVICE_ARN=$(echo "$SERVICE_MATCHES" | tr -s '[:space:]' '\n' | head -n 1)
            SERVICE_NAME=$(echo "$SERVICE_ARN" | awk -F'/' '{print $3}')
          else
            # Fallback to inspecting target cluster services if service tagging is managed at cluster level
            SERVICE_NAME=$(aws ecs list-services --cluster "$CLUSTER_NAME" --query 'serviceArns[0]' --output text 2>/dev/null | awk -F'/' '{print $3}')
          fi

          echo "cluster_name=$CLUSTER_NAME" >> "$GITHUB_OUTPUT"
          echo "service_name=$SERVICE_NAME" >> "$GITHUB_OUTPUT"
          echo "alb_dns=$ALB_DNS" >> "$GITHUB_OUTPUT"

          echo "### 🔍 Environment-Aware AWS Infrastructure Discovered" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Environment**: \`${TARGET_ENV}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **ECS Cluster**: \`${CLUSTER_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **ECS Service**: \`${SERVICE_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **ALB Endpoint**: \`${ALB_DNS}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Validation Guard**: Verified Single-Resource Match for \`Project=VaultForge\` + \`Environment=${TARGET_ENV}\`" >> $GITHUB_STEP_SUMMARY

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Cosign verify (pre-deploy sanity check)
        run: cosign verify ${{ inputs.image_digest }} --certificate-identity-regexp "https://github.com/sanmathik8/Vaultforge_cloud/.*" --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Check ECS Service Active Image Checkpoint
        id: ecs-checkpoint
        run: |
          CLUSTER="${{ steps.discover-infra.outputs.cluster_name }}"
          SERVICE="${{ steps.discover-infra.outputs.service_name }}"
          ACTIVE_TASK_DEF=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --query 'services[0].taskDefinition' --output text 2>/dev/null || echo "")
          
          if [ -n "$ACTIVE_TASK_DEF" ] && [ "$ACTIVE_TASK_DEF" != "None" ]; then
            ACTIVE_IMAGE=$(aws ecs describe-task-definition --task-definition "$ACTIVE_TASK_DEF" --query 'taskDefinition.containerDefinitions[0].image' --output text 2>/dev/null || echo "")
          else
            ACTIVE_IMAGE=""
          fi

          if [ "$ACTIVE_IMAGE" = "${{ inputs.image_digest }}" ]; then
            echo "already_deployed=true" >> "$GITHUB_OUTPUT"
            echo "### ⏩ ECS Deployment Checkpoint Hit" >> $GITHUB_STEP_SUMMARY
            echo "ECS Service \`${SERVICE}\` is already running target image digest \`${{ inputs.image_digest }}\`. Skipping duplicate rollout." >> $GITHUB_STEP_SUMMARY
          else
            echo "already_deployed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Render Task Definition with signed image digest & execution roles
        if: steps.ecs-checkpoint.outputs.already_deployed != 'true'
        id: render-taskdef
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          EXEC_ROLE_ARN="arn:aws:iam::${ACCOUNT_ID}:role/vault-forge-ecs-execution-role"
          TASK_ROLE_ARN="arn:aws:iam::${ACCOUNT_ID}:role/vault-forge-ecs-task-role"

          jq --arg img "${{ inputs.image_digest }}" \
             --arg exec "$EXEC_ROLE_ARN" \
             --arg task "$TASK_ROLE_ARN" \
             '.containerDefinitions[0].image = $img | .executionRoleArn = $exec | .taskRoleArn = $task' \
             ecs/task-definition.json > rendered-taskdef.json

          echo "Task definition rendered successfully with execution role $EXEC_ROLE_ARN"

      - name: Register ECS Task Definition
        if: steps.ecs-checkpoint.outputs.already_deployed != 'true'
        id: register-taskdef
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition --cli-input-json file://rendered-taskdef.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "task_def_arn=$TASK_DEF_ARN" >> "$GITHUB_OUTPUT"

      - name: Update ECS Service (Rolling Deployment)
        if: steps.ecs-checkpoint.outputs.already_deployed != 'true'
        id: rollout
        continue-on-error: true
        run: |
          CLUSTER="${{ steps.discover-infra.outputs.cluster_name }}"
          SERVICE="${{ steps.discover-infra.outputs.service_name }}"
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --task-definition ${{ steps.register-taskdef.outputs.task_def_arn }} --force-new-deployment
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"

      - name: Application health check via ALB
        run: |
          CLUSTER="${{ steps.discover-infra.outputs.cluster_name }}"
          SERVICE="${{ steps.discover-infra.outputs.service_name }}"
          echo "Verifying ECS service status..."
          aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE"
