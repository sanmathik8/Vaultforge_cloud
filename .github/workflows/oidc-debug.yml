name: GitHub OIDC Token Payload Claims Debug

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  oidc-debug:
    name: Decode OIDC Claims
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and Decode OIDC JWT Payload Claims
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const token = await core.getIDToken("sts.amazonaws.com");
              const payloadBase64 = token.split('.')[1];
              const payloadJson = Buffer.from(payloadBase64, 'base64').toString('utf-8');
              const payload = JSON.parse(payloadJson);

              console.log("=== GitHub OIDC Claims Payload ===");
              console.log("iss:", payload.iss);
              console.log("aud:", payload.aud);
              console.log("sub:", payload.sub);
              console.log("repository:", payload.repository);
              console.log("repository_owner:", payload.repository_owner);
              console.log("ref:", payload.ref);
              console.log("workflow:", payload.workflow);
              console.log("job_workflow_ref:", payload.job_workflow_ref);
              console.log("event_name:", payload.event_name);
            } catch (err) {
              console.log("Error obtaining OIDC ID token:", err.message);
              process.exit(1);
            }
