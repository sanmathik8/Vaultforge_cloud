name: VaultForge Enterprise DevSecOps Pipeline

on:
  push:
    branches: [main, 'scratch/**']
  pull_request:
    branches: [main, 'scratch/**']
  workflow_dispatch:
    inputs:
      overlay:
        description: 'Target environment overlay (dev, qa, staging, prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - qa
          - staging
          - prod

concurrency:
  group: vaultforge-pipeline-${{ github.ref }}
  cancel-in-progress: true

# Top-Level Permission Ceiling: Superset of all permissions required by reusable sub-workflows.
permissions:
  contents: read
  id-token: write
  security-events: write
  issues: write

jobs:
  # ---------------------------------------------------------------
  # 1. Security Scanning (SAST, SCA, Linters, TaskDef Validation)
  # ---------------------------------------------------------------
  security:
    name: Security & Quality
    permissions:
      contents: read
      security-events: write
      issues: write
    uses: ./.github/workflows/security.yml
    with:
      app_path: ./app
    secrets: inherit

  # ---------------------------------------------------------------
  # 2. Build, SBOM, Image Vulnerability Scanning & Signing
  # ---------------------------------------------------------------
  build:
    name: Build & Container Security
    needs: security
    permissions:
      contents: read
      id-token: write
      security-events: write
      issues: write
    uses: ./.github/workflows/build.yml
    with:
      app_path: ./app
      image_name: vault-forge-app
      aws_region: ap-south-1
      overlay: ${{ inputs.overlay || 'dev' }}
    secrets: inherit

  # ---------------------------------------------------------------
  # 3. Infrastructure Validation & ECS Fargate Deployment
  # ---------------------------------------------------------------
  deploy:
    name: Infrastructure & CD Deploy
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
      security-events: write
    uses: ./.github/workflows/deploy.yml
    with:
      image_digest: ${{ needs.build.outputs.image_digest || '' }}
      overlay: ${{ inputs.overlay || 'dev' }}
      aws_region: ap-south-1
    secrets: inherit

  # ---------------------------------------------------------------
  # 4. Post-Deployment Validation & DAST Scanning
  # ---------------------------------------------------------------
  validate:
    name: Post-Deploy Validation & DAST
    needs: [deploy, build]
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      issues: write
      security-events: write
    uses: ./.github/workflows/validate.yml
    with:
      image_digest: ${{ needs.build.outputs.image_digest || '' }}
      overlay: ${{ inputs.overlay || 'dev' }}
      rollout_result: ${{ needs.deploy.outputs.rollout_result || 'skipped' }}
      already_deployed: ${{ needs.deploy.outputs.already_deployed || 'false' }}
      alb_dns_name: ${{ needs.deploy.outputs.alb_dns_name || '' }}
    secrets: inherit
