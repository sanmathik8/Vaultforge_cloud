name: VaultForge Build - Image, SBOM, Scan, Sign & Push

on:
  workflow_call:
    inputs:
      app_path:
        type: string
        default: ./app
      image_name:
        type: string
        default: vault-forge-app
      aws_region:
        type: string
        default: ap-south-1
      overlay:
        type: string
        default: dev
    secrets:
      AWS_ROLE_TO_ASSUME:
        required: false
    outputs:
      image_digest:
        value: ${{ jobs.sign-and-push.outputs.image_digest || jobs.check-ecr-checkpoint.outputs.existing_digest }}
      ecr_repository_url:
        value: ${{ jobs.check-ecr-checkpoint.outputs.ecr_repository_url }}

concurrency:
  group: vaultforge-build-${{ inputs.overlay }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  APP_PATH: ${{ inputs.app_path || './app' }}
  IMAGE_NAME: ${{ inputs.image_name || 'vault-forge-app' }}

jobs:
  # ---------------------------------------------------------------
  # Checkpoint 1 & Metadata Discovery: Multi-Tag ECR Repository URI
  # ---------------------------------------------------------------
  check-ecr-checkpoint:
    name: Environment-Aware AWS Discovery & ECR Checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      image_exists: ${{ steps.ecr-check.outputs.image_exists }}
      existing_digest: ${{ steps.ecr-check.outputs.existing_digest }}
      ecr_repository_url: ${{ steps.discover.outputs.ecr_url }}
      repo_name: ${{ steps.discover.outputs.repo_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check AWS role secret configured
        id: check-secrets
        env:
          AWS_ROLE: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        run: |
          if [ -z "$AWS_ROLE" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail if AWS role not configured
        if: steps.check-secrets.outputs.configured != 'true'
        run: |
          echo "::error::AWS_ROLE_TO_ASSUME is not set — failing explicitly."
          exit 1

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ inputs.aws_region || 'ap-south-1' }}
          audience: sts.amazonaws.com

      - name: Multi-Tag Environment-Aware ECR Discovery
        id: discover
        run: |
          TARGET_ENV="${{ inputs.overlay || 'dev' }}"
          echo "Querying AWS Resource Groups Tagging API for Project=VaultForge and Environment=$TARGET_ENV..."

          # Discover ECR repository matching BOTH Project=VaultForge and Environment=$TARGET_ENV
          MATCHES=$(aws resourcegroupstaggingapi get-resources \
            --tag-filters Key=Project,Values=VaultForge Key=Environment,Values="$TARGET_ENV" \
            --resource-type-filters ecr:repository \
            --query 'ResourceTagMappingList[*].ResourceARN' --output text 2>/dev/null || echo "")

          COUNT=$(echo "$MATCHES" | tr -s '[:space:]' '\n' | sed '/^$/d' | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            # Fallback to default naming if repository is shared across environments
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            REGION="${{ inputs.aws_region || 'ap-south-1' }}"
            REPO_NAME="${{ inputs.image_name || 'vault-forge-app' }}"
            ECR_URL="${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com/${REPO_NAME}"
          elif [ "$COUNT" -gt 1 ]; then
            echo "::error::Ambiguous infrastructure! Found $COUNT ECR repositories matching Project=VaultForge and Environment=$TARGET_ENV: $MATCHES"
            exit 1
          else
            ECR_ARN=$(echo "$MATCHES" | tr -s '[:space:]' '\n' | head -n 1)
            REPO_NAME=$(echo "$ECR_ARN" | sed 's|.*repository/||')
            ACCOUNT_ID=$(echo "$ECR_ARN" | cut -d':' -f5)
            REGION=$(echo "$ECR_ARN" | cut -d':' -f4)
            ECR_URL="${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com/${REPO_NAME}"
          fi

          echo "ecr_url=$ECR_URL" >> "$GITHUB_OUTPUT"
          echo "ecr_url=$ECR_URL" >> "$GITHUB_ENV"
          echo "repo_name=$REPO_NAME" >> "$GITHUB_OUTPUT"

          echo "### 🔍 Environment-Aware ECR Discovered" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Environment**: \`${TARGET_ENV}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **ECR Repository URI**: \`${ECR_URL}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Filter**: \`Project=VaultForge\` + \`Environment=${TARGET_ENV}\`" >> $GITHUB_STEP_SUMMARY

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Inspect ECR for existing commit image tag
        id: ecr-check
        run: |
          REPO_NAME="${{ steps.discover.outputs.repo_name }}"
          TAG="${{ github.sha }}"
          ECR_URL="${{ steps.discover.outputs.ecr_url }}"
          EXISTING_DIGEST=$(aws ecr describe-images --repository-name "$REPO_NAME" --image-ids imageTag="$TAG" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || echo "")

          if [ -n "$EXISTING_DIGEST" ] && [ "$EXISTING_DIGEST" != "None" ]; then
            FULL_DIGEST="${ECR_URL}@${EXISTING_DIGEST}"
            echo "image_exists=true" >> "$GITHUB_OUTPUT"
            echo "existing_digest=$FULL_DIGEST" >> "$GITHUB_OUTPUT"
            echo "### ⏩ ECR Image Checkpoint Hit" >> $GITHUB_STEP_SUMMARY
            echo "Image \`${FULL_DIGEST}\` already exists in ECR. Skipping Docker build & SBOM." >> $GITHUB_STEP_SUMMARY
          else
            echo "image_exists=false" >> "$GITHUB_OUTPUT"
            echo "existing_digest=" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------
  # Build Image & Generate SBOM (Skipped if ECR Checkpoint Hit)
  # ---------------------------------------------------------------
  build-and-sbom:
    name: Build Image + SBOM
    needs: check-ecr-checkpoint
    if: needs.check-ecr-checkpoint.outputs.image_exists != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      sbom_result: ${{ steps.sbom.outcome }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image with GHA layer caching
        id: docker-build
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.APP_PATH }}
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image for downstream jobs
        run: docker save ${{ env.IMAGE_NAME }}:${{ github.sha }} -o image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

      - name: Install Syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM
        id: sbom
        run: syft ${{ env.IMAGE_NAME }}:${{ github.sha }} -o cyclonedx-json=sbom.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.json
          retention-days: 30

  # ---------------------------------------------------------------
  # Trivy - Container Vulnerability Scan (Skipped if Checkpoint Hit)
  # ---------------------------------------------------------------
  image-scan:
    name: Trivy - Container Vulnerability Scan
    needs: [check-ecr-checkpoint, build-and-sbom]
    if: always() && needs.check-ecr-checkpoint.outputs.image_exists != 'true' && (needs.build-and-sbom.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    outputs:
      critical_count: ${{ steps.count.outputs.critical }}
      high_count: ${{ steps.count.outputs.high }}
      result: ${{ steps.gate.outcome }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
      - run: docker load -i image.tar
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      - name: Run Trivy scan (SARIF + JSON)
        id: trivy
        continue-on-error: true
        run: |
          trivy image --severity CRITICAL,HIGH --format sarif --output trivy-results.sarif ${{ env.IMAGE_NAME }}:${{ github.sha }} || true
          trivy image --severity CRITICAL,HIGH --format json --output trivy-report.json ${{ env.IMAGE_NAME }}:${{ github.sha }} || true
      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy
      - name: Count findings
        id: count
        run: |
          CRIT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-report.json 2>/dev/null || echo 0)
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-report.json 2>/dev/null || echo 0)
          echo "critical=$CRIT" >> "$GITHUB_OUTPUT"
          echo "high=$HIGH" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('trivy-report.json') != ''
        with:
          name: trivy-report
          path: trivy-report.json
          retention-days: 30
      - name: Security Policy Gate
        id: gate
        if: ${{ vars.ALLOW_CRITICAL_CVES != 'true' }}
        run: |
          CRIT=${{ steps.count.outputs.critical }}
          if [ "$CRIT" -gt 0 ]; then
            echo "::error::$CRIT CRITICAL CVE(s) found. Blocking sign/push."
            exit 1
          fi

  # ---------------------------------------------------------------
  # Cosign Sign + Push to Amazon ECR (Idempotent Signature Check)
  # ---------------------------------------------------------------
  sign-and-push:
    name: Cosign Sign + Push to ECR
    needs: [check-ecr-checkpoint, image-scan]
    if: always() && (needs.check-ecr-checkpoint.outputs.image_exists == 'true' || needs.image-scan.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write   # required for OIDC
    outputs:
      image_digest: ${{ steps.push.outputs.digest || needs.check-ecr-checkpoint.outputs.existing_digest }}
    steps:
      - name: Check AWS credentials secret configured
        id: check-secrets
        env:
          AWS_ROLE: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        run: |
          if [ -z "$AWS_ROLE" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail if AWS role not configured
        if: steps.check-secrets.outputs.configured != 'true'
        run: |
          echo "::error::AWS_ROLE_TO_ASSUME is not set — failing explicitly."
          exit 1

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ inputs.aws_region || 'ap-south-1' }}
          audience: sts.amazonaws.com

      - name: Tag-Based ECR Repository Discovery
        id: discover-ecr
        run: |
          ECR_URL="${{ needs.check-ecr-checkpoint.outputs.ecr_repository_url }}"
          echo "ecr_url=$ECR_URL" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download build artifact
        if: needs.check-ecr-checkpoint.outputs.image_exists != 'true'
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Tag and push image if new build
        if: needs.check-ecr-checkpoint.outputs.image_exists != 'true'
        id: push
        run: |
          docker load -i image.tar
          ECR_URL="${{ steps.discover-ecr.outputs.ecr_url }}"
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${ECR_URL}:${{ github.sha }}
          docker push ${ECR_URL}:${{ github.sha }}
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${ECR_URL}:${{ github.sha }})
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Check Cosign Signature (Checkpoint Check)
        id: cosign-check
        run: |
          TARGET_DIGEST="${{ steps.push.outputs.digest || needs.check-ecr-checkpoint.outputs.existing_digest }}"
          echo "Checking if signature already exists for $TARGET_DIGEST..."
          if cosign verify "$TARGET_DIGEST" --certificate-identity-regexp "https://github.com/sanmathik8/Vaultforge_cloud/.*" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" >/dev/null 2>&1; then
            echo "already_signed=true" >> "$GITHUB_OUTPUT"
            echo "### ⏩ Cosign Signature Checkpoint Hit" >> $GITHUB_STEP_SUMMARY
            echo "Image \`${TARGET_DIGEST}\` is already signed via Cosign. Skipping duplicate signing." >> $GITHUB_STEP_SUMMARY
          else
            echo "already_signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign image (keyless) if unsigned
        if: steps.cosign-check.outputs.already_signed != 'true'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          TARGET_DIGEST="${{ steps.push.outputs.digest || needs.check-ecr-checkpoint.outputs.existing_digest }}"
          echo "Signing container image digest \`${TARGET_DIGEST}\` via Cosign keyless OIDC..."
          cosign sign --yes "$TARGET_DIGEST"

      - name: Verify Cosign Signature (Final Verification)
        run: |
          TARGET_DIGEST="${{ steps.push.outputs.digest || needs.check-ecr-checkpoint.outputs.existing_digest }}"
          echo "Verifying Cosign signature for \`${TARGET_DIGEST}\`..."
          cosign verify "$TARGET_DIGEST" --certificate-identity-regexp "https://github.com/sanmathik8/Vaultforge_cloud/.*" --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
