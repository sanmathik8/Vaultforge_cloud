name: VaultForge Security - SAST, SCA & TaskDef Validation

on:
  workflow_call:
    inputs:
      app_path:
        type: string
        default: ./app

concurrency:
  group: vaultforge-security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  APP_PATH: ${{ inputs.app_path || './app' }}

jobs:
  # ---------------------------------------------------------------
  # Stage 0: Run Application correctness checks (Unit Tests)
  # ---------------------------------------------------------------
  application-tests:
    name: Django Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        working-directory: ${{ env.APP_PATH }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Django Tests
        working-directory: ${{ env.APP_PATH }}
        run: python manage.py test

  # ---------------------------------------------------------------
  # Stage 1: Validate Dockerfile exists
  # ---------------------------------------------------------------
  validate-dockerfile:
    name: Validate Dockerfile
    needs: application-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check Dockerfile exists
        run: |
          if [ ! -f "${{ env.APP_PATH }}/Dockerfile" ]; then
            echo "::error::No Dockerfile found at ${{ env.APP_PATH }}/Dockerfile"
            echo "Run 'docker init' locally to generate a production-ready Dockerfile,"
            echo "review it, commit it, and re-run the pipeline."
            exit 1
          fi

  # ---------------------------------------------------------------
  # Stage 2: Gitleaks Secrets Scan
  # ---------------------------------------------------------------
  secrets-scan:
    name: Gitleaks - Secrets Scan
    needs: validate-dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    outputs:
      result: ${{ steps.gitleaks.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Handle failure
        if: steps.gitleaks.outcome == 'failure'
        uses: ./.github/actions/graceful-exit
        with:
          stage: "Gitleaks Secrets Scan"
          reason: "Exposed secrets were found. Remove the secret and rotate it if it was ever pushed."

  # ---------------------------------------------------------------
  # Stage 3: Hadolint - Dockerfile Best Practices
  # ---------------------------------------------------------------
  dockerfile-lint:
    name: Hadolint - Dockerfile Best Practices
    needs: validate-dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Run Hadolint
        id: hadolint
        continue-on-error: true
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ env.APP_PATH }}/Dockerfile
          format: sarif
          output-file: hadolint.sarif
      - name: Upload Hadolint SARIF
        if: always() && hashFiles('hadolint.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: hadolint.sarif
          category: hadolint

  # ---------------------------------------------------------------
  # Stage 4: OSV-Scanner - Dependency Vulnerability Scan
  # ---------------------------------------------------------------
  dependency-scan:
    name: OSV-Scanner - Dependency Scan
    needs: secrets-scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Install and Run OSV-Scanner
        id: osv
        continue-on-error: true
        run: |
          curl -sfL https://github.com/google/osv-scanner/releases/download/v1.9.2/osv-scanner_1.9.2_linux_amd64 -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner
          osv-scanner --output=osv-results.sarif --format=sarif -r ${{ env.APP_PATH }} || true
      - name: Upload OSV SARIF
        if: always() && hashFiles('osv-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner

  # ---------------------------------------------------------------
  # Stage 5: Semgrep - Static Application Security Testing (SAST)
  # ---------------------------------------------------------------
  sast-scan:
    name: Semgrep - SAST
    needs: secrets-scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    outputs:
      critical_count: ${{ steps.count.outputs.critical }}
      finding_count: ${{ steps.count.outputs.findings }}
      result: ${{ steps.gate.outcome }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Semgrep
        run: pip install semgrep
      - name: Run Semgrep scan (SARIF)
        id: semgrep-sarif
        continue-on-error: true
        run: |
          semgrep scan \
            --config=p/owasp-top-ten --config=p/django --config=p/python \
            --sarif --output=semgrep.sarif \
            ${{ env.APP_PATH }} || true
      - name: Run Semgrep scan (JSON)
        id: semgrep-json
        continue-on-error: true
        run: |
          semgrep scan \
            --config=p/owasp-top-ten --config=p/django --config=p/python \
            --json --output=semgrep.json \
            ${{ env.APP_PATH }} || true
      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Count findings
        id: count
        if: always()
        run: |
          COUNT=$(jq '.results | length' semgrep.json 2>/dev/null || echo 0)
          CRIT=$(jq '[.results[]? | select(.extra.severity=="ERROR")] | length' semgrep.json 2>/dev/null || echo 0)
          echo "findings=$COUNT" >> "$GITHUB_OUTPUT"
          echo "critical=$CRIT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('semgrep.json') != ''
        with:
          name: semgrep-report
          path: semgrep.json
          retention-days: 30
      - name: Gate on critical findings
        id: gate
        if: ${{ vars.ALLOW_CRITICAL_CVES != 'true' }}
        run: |
          CRIT=${{ steps.count.outputs.critical }}
          if [ "$CRIT" -gt 0 ]; then
            echo "::error::$CRIT critical-severity Semgrep finding(s). Failing build."
            exit 1
          fi

  # ---------------------------------------------------------------
  # Stage 6: ECS Task Definition Validation
  # ---------------------------------------------------------------
  taskdef-validation:
    name: ECS Task Definition JSON Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate Task Definition JSON syntax
        run: jq . ecs/task-definition.json

  iac-validation:
    name: Checkov & Terraform Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Run Checkov IaC Scan
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/bootstrap
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail: true
      - name: Upload Checkov SARIF
        if: always() && hashFiles('checkov-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-results.sarif
          category: checkov
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform Validate
        working-directory: terraform/bootstrap
        run: |
          terraform init -backend=false
          terraform validate
